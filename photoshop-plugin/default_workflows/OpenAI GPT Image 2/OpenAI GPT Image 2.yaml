environment: "local", "cloud", "runcomfy", "runpod"
input: ("3", "Main Image"), ("5", "Image 2"), ("6", "Image 3"), ("7", "Image 4"), ("8", "Image 5"), ("9", "Image 6"), ("10", "Image 7"), ("11", "Image 8"), ("12", "Image 9"), ("13", "Image 10"), ("14", "Image 11"), ("16", "Image 12"), ("17", "Image 13"), ("18", "Image 14"), ("15", "Image 15"), ("19", "Image 16")
scaled_down_additional_inputs_default: true
output: "4"

node_id: "2"
    prompt:
        type: bigtextbox
        data_type: string
        label: "Prompt"
        default: ""
    model:
        type: dropdown
        data_type: string
        label: "Model"
        default: "gpt-image-2"
        options:
            - "gpt-image-2"
            - "gpt-image-1.5"
            - "gpt-image-1"
    model.size:
        type: dropdown
        data_type: string
        label: "Size"
        default: "auto"
        options:
            - "auto"
            - "1024x1024"
            - "1024x1536"
            - "1536x1024"
            - "2048x2048"
            - "2048x1152"
            - "1152x2048"
            - "3840x2160"
            - "2160x3840"
            - "Custom"
    model.custom_width:
        type: textbox
        data_type: integer
        label: "Custom Width"
        default: "1024"
    model.custom_height:
        type: textbox
        data_type: integer
        label: "Custom Height"
        default: "1024"
    model.background:
        type: dropdown
        data_type: string
        label: "Background"
        default: "auto"
        options:
            - "auto"
            - "opaque"
    model.quality:
        type: dropdown
        data_type: string
        label: "Quality"
        default: "low"
        options:
            - "low"
            - "medium"
            - "high"
    seed:
        type: seed
        data_type: integer
        label: "Seed"
        default: "0"
